name: Build and Release macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code (tag)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: pip install setuptools
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build app
      run: npm run package
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        CSC_IDENTITY_AUTO_DISCOVERY: true
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ProxyBat-macOS
        path: dist/*.dmg
    
    - name: Get version and SHA256
      id: get_info
      run: |
        # Get version from package.json (not from tag)
        VERSION=$(node -p "require('./package.json').version")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        # Get SHA256 for arm64 build (default for Homebrew)
        SHA256=$(shasum -a 256 dist/*-arm64.dmg | awk '{print $1}')
        echo "sha256=$SHA256" >> $GITHUB_OUTPUT
        echo "App version: $VERSION"
        echo "DMG SHA256: $SHA256"
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*.dmg
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Checkout main branch
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Update Homebrew Cask on main
      run: |
        VERSION=${{ steps.get_info.outputs.version }}
        SHA256=${{ steps.get_info.outputs.sha256 }}
        
        # Update version and SHA256 in cask file
        sed -i.bak "s/version \"[^\"]*\"/version \"$VERSION\"/" Casks/proxybat.rb
        sed -i.bak "s/sha256 \"[^\"]*\"/sha256 \"$SHA256\"/" Casks/proxybat.rb
        rm Casks/proxybat.rb.bak
        
        # Show the changes
        cat Casks/proxybat.rb
    
    - name: Commit updated cask
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add Casks/proxybat.rb
        git commit -m "Update Homebrew cask to v${{ steps.get_info.outputs.version }}" || echo "No changes to commit"
        git push
